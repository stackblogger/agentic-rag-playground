services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agentic-rag-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentic_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentic_rag"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: agentic-rag-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@agentic-rag-db:5432/agentic_rag
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/data/uploads

volumes:
  pgdata:
